<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>GRE 等价词训练</title>
  <style>
    :root{--ink:#17231b;--muted:#748078;--paper:#f6f3ea;--card:#fffefa;--green:#1c6b4b;--soft:#e8f4ed;--line:#dfe4dc;--red:#ad4943}
    *{box-sizing:border-box}body{margin:0;min-height:100vh;background:radial-gradient(circle at 10% 5%,#dcecdf,transparent 30rem),linear-gradient(#fbfaf5,var(--paper));color:var(--ink);font-family:Inter,"PingFang SC","Microsoft YaHei",sans-serif}
    main{width:min(900px,calc(100% - 28px));margin:auto;padding-bottom:30px}.top{height:76px;border-bottom:1px solid #17231b1c;display:flex;align-items:center;justify-content:space-between}.brand{font-weight:800}.brand b{background:var(--ink);color:#fff;border-radius:7px;padding:7px 8px;margin-right:8px}.stats{color:var(--muted);font-size:13px}.stats strong{color:var(--ink);font-size:16px;margin-left:5px}
    .hero{text-align:center;padding:46px 0 24px}.eyebrow{color:var(--green);font-size:11px;font-weight:800;letter-spacing:.18em;text-transform:uppercase}.hero h1{font-family:Georgia,"Songti SC",serif;font-size:clamp(34px,6vw,48px);margin:10px 0;letter-spacing:-.04em}.hero p:last-child{color:var(--muted);font-size:14px}
    .days{display:grid;grid-template-columns:repeat(5,1fr);gap:8px;margin:0 auto 18px}.day{border:1px solid var(--line);background:#fff9;border-radius:10px;padding:11px 6px;color:var(--muted);font-weight:700;cursor:pointer}.day.active{background:var(--ink);border-color:var(--ink);color:#fff}.day.done::after{content:" ✓";color:#76c79e}.day.active.done::after{color:#a8dfbf}
    .card{background:#fffefaf5;border:1px solid #17231b20;border-radius:21px;padding:26px;box-shadow:0 22px 60px #2a372d14}.progress{display:flex;justify-content:space-between;color:var(--muted);font-size:13px;margin-bottom:18px}.options{display:grid;grid-template-columns:1fr 1fr;gap:11px}
    .option{min-height:72px;border:1px solid var(--line);border-radius:13px;background:#fff;padding:0 17px;display:grid;grid-template-columns:28px 1fr 20px;align-items:center;text-align:left;font:20px Georgia,serif;color:var(--ink);cursor:pointer;transition:.15s}.option:hover{transform:translateY(-2px);border-color:#9eb2a4}.num{font:11px system-ui;color:#98a39c;border:1px solid var(--line);border-radius:5px;width:21px;height:21px;display:grid;place-items:center}.option.selected,.option.correct{border-color:var(--green);background:var(--soft);box-shadow:inset 0 0 0 1px var(--green)}.option.wrong{border-color:var(--red);background:#faecea}.mark{font:bold 17px system-ui;color:var(--green)}.wrong .mark{color:var(--red)}
    .feedback{margin-top:17px;border-radius:12px;padding:15px 17px}.feedback.ok{background:var(--soft);color:#155b3f}.feedback.no{background:#faecea;color:#8e3934}.feedback h2{font-size:14px;margin:0 0 4px}.feedback p{font:17px Georgia,serif;margin:0}.meaning{font:13px system-ui;margin-left:10px;opacity:.75}
    .meanings{margin-top:12px;display:grid;grid-template-columns:1fr 1fr;gap:7px 18px;padding-top:12px;border-top:1px solid currentColor}.meaning-row{display:flex;justify-content:space-between;gap:12px;font-size:12px}.meaning-row b{font:14px Georgia,serif}.meaning-row span{text-align:right;opacity:.78}
    .primary{width:100%;border:0;border-radius:12px;background:var(--ink);color:#fff;padding:16px;margin-top:20px;font-weight:750;font-size:15px;cursor:pointer}.primary:disabled{background:#dfe3df;color:#9ba39e;cursor:not-allowed}footer{text-align:center;color:#929b95;font-size:12px;margin-top:22px}
    .complete{text-align:center;padding:28px 10px}.complete .ring{width:92px;height:92px;border:8px solid var(--soft);border-top-color:var(--green);border-radius:50%;display:grid;place-items:center;margin:0 auto 18px;font:700 22px Georgia,serif}.complete h2{font:28px Georgia,"Songti SC",serif;margin:0 0 8px}.complete p{color:var(--muted)}.complete button{max-width:340px}
    .word-list-entry{position:fixed;right:22px;bottom:22px;z-index:20;border:0;border-radius:999px;background:var(--green);color:#fff;padding:14px 19px;font-weight:750;box-shadow:0 10px 28px #163f2d40;cursor:pointer}
    .list-page{position:fixed;inset:0;z-index:30;background:var(--paper);overflow:auto;display:none}.list-page.open{display:block}.list-shell{width:min(900px,calc(100% - 28px));margin:auto;padding:22px 0 50px}.list-head{position:sticky;top:0;z-index:2;background:#f6f3eaf2;backdrop-filter:blur(12px);display:flex;align-items:center;justify-content:space-between;padding:12px 0 16px;border-bottom:1px solid var(--line)}.back{border:1px solid var(--line);background:#fff;border-radius:10px;padding:11px 14px;color:var(--ink);font-weight:700;cursor:pointer}.list-title{text-align:right}.list-title h2{margin:0;font:700 25px Georgia,"Songti SC",serif}.list-title span{font-size:12px;color:var(--muted)}.vocab-list{display:grid;gap:9px;margin-top:18px}.vocab-row{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:15px 17px;display:grid;grid-template-columns:150px 1fr 220px;gap:16px;align-items:center}.vocab-word{font:700 18px Georgia,serif}.vocab-synonyms{font:15px Georgia,serif;color:var(--green)}.vocab-meaning{font-size:13px;color:var(--muted);text-align:right}
    @media(max-width:620px){main{width:calc(100% - 20px)}.top{height:62px}.brand{font-size:14px}.brand b{padding:6px}.hero{padding:27px 0 17px}.hero h1{font-size:31px}.hero p:last-child{font-size:13px;margin-bottom:0}.days{gap:4px;margin-bottom:10px}.day{font-size:11px;padding:9px 1px}.options{grid-template-columns:1fr;gap:7px}.option{min-height:56px;font-size:18px;padding:0 13px}.card{padding:14px;border-radius:16px}.progress{margin-bottom:12px}.stats .accuracy{display:none}.meaning{display:block;margin:4px 0 0}.meanings{grid-template-columns:1fr}.feedback{padding:13px;margin-top:12px}.primary{margin-top:13px;padding:15px;position:sticky;bottom:8px}.complete{padding:18px 4px}.word-list-entry{right:12px;bottom:12px;padding:12px 15px}.list-shell{width:calc(100% - 20px);padding-top:8px}.list-head{padding:8px 0 12px}.list-title h2{font-size:21px}.vocab-row{grid-template-columns:1fr;padding:13px;gap:5px}.vocab-meaning{text-align:left}.vocab-synonyms{font-size:14px}}
  </style>
</head>
<body>
<main>
  <div class="top"><div class="brand"><b>GRE</b>等价词训练</div><div class="stats"><span class="accuracy">正确率 <strong id="accuracy">0%</strong>　</span>连续答对 <strong id="streak">0</strong></div></div>
  <section class="hero"><div class="eyebrow">Sentence Equivalence</div><h1>选出两个意思等价的词</h1><p>从六个选项中选择两个，选满后提交答案。</p></section>
  <nav class="days" id="days" aria-label="选择学习日"></nav>
  <section class="card">
    <div class="progress"><span id="round">第 1 题</span><span id="count">0 / 2 已选择</span></div>
    <div class="options" id="options"></div>
    <div id="feedback"></div>
    <button class="primary" id="action" disabled>提交答案</button>
  </section>
  <footer id="footer">正在按 Day 1–Day 5 整理 PDF 词库…</footer>
</main>
<button class="word-list-entry" id="open-list" type="button">Day 1 词表</button>
<section class="list-page" id="list-page" aria-hidden="true">
  <div class="list-shell">
    <header class="list-head">
      <button class="back" id="close-list" type="button">← 返回做题</button>
      <div class="list-title"><h2 id="list-title">Day 1 单词表</h2><span id="list-count"></span></div>
    </header>
    <div class="vocab-list" id="vocab-list"></div>
  </div>
</section>
<script src="public/word-groups.js"></script>
<script>
let groups=[],day=1,queue=[],position=0,question=null,selected=[],checked=false,correct=0,total=0,streak=0;
let results=JSON.parse(localStorage.getItem("gre-day-results")||"{}");
let progress=JSON.parse(localStorage.getItem("gre-day-progress")||"{}");
let history=JSON.parse(localStorage.getItem("gre-answer-history")||"{}");
const $=id=>document.getElementById(id);
const shuffle=a=>{a=[...a];for(let i=a.length-1;i;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a};
function selectDay(n){
  day=n;
  $("open-list").textContent=`Day ${day} 词表`;
  if(results[day]){showSavedResult();renderDays();return}
  const saved=progress[day];
  const dayGroups=groups.filter(g=>g.day===day);
  queue=saved?.queue?.length?saved.queue.map(word=>dayGroups.find(g=>g.word===word)).filter(Boolean):shuffle(dayGroups);
  position=saved?.position||0;correct=saved?.correct||0;total=saved?.total||0;streak=saved?.streak||0;
  selected=[];checked=false;buildQuestion();renderDays();
}
function buildQuestion(){
  if(position>=queue.length){showComplete();return}
  const g=queue[position], synonym=g.synonyms[Math.floor(Math.random()*g.synonyms.length)];
  const answers=[g.word,synonym], forbidden=new Set([g.word,...g.synonyms]);
  const meaningMap=new Map(groups.map(x=>[x.word,x.meaning]));
  const pool=shuffle(groups.map(x=>x.word).filter(x=>!forbidden.has(x)));
  const words=shuffle([...answers,...new Set(pool)].slice(0,6));
  question={answers,meaning:g.meaning,options:words.map(word=>({word,meaning:meaningMap.get(word)||(answers.includes(word)?g.meaning:"词义见原题语境")}))};
  selected=[];checked=false;render();
}
function renderDays(){$("days").innerHTML=[1,2,3,4,5].map(n=>`<button class="day ${n===day?"active":""} ${results[n]?"done":""}" data-day="${n}">Day ${n}</button>`).join("");document.querySelectorAll(".day").forEach(b=>b.onclick=()=>selectDay(Number(b.dataset.day)))}
function choose(word){if(checked)return;selected=selected.includes(word)?selected.filter(x=>x!==word):selected.length<2?[...selected,word]:selected;render()}
function isRight(){return selected.length===2&&question.answers.every(x=>selected.includes(x))}
function saveProgress(){
  progress[day]={queue:queue.map(g=>g.word),position,correct,total,streak,updatedAt:new Date().toISOString()};
  localStorage.setItem("gre-day-progress",JSON.stringify(progress));
}
function submit(){if(!checked){if(selected.length!==2)return;checked=true;total++;if(isRight()){correct++;streak++}else streak=0;(history[day]??=[]).push({word:queue[position].word,selected:[...selected],answers:[...question.answers],correct:isRight(),time:new Date().toISOString()});localStorage.setItem("gre-answer-history",JSON.stringify(history));saveProgress();render()}else{position++;saveProgress();buildQuestion()}}
function render(){
  $("round").textContent=`Day ${day} · 第 ${position+1} / ${queue.length} 题`;$("count").textContent=`${selected.length} / 2 已选择`;
  $("accuracy").textContent=total?`${Math.round(correct/total*100)}%`:"0%";$("streak").textContent=streak;
  $("options").innerHTML=question.options.map((o,i)=>{const w=o.word,sel=selected.includes(w),ans=question.answers.includes(w);let state=checked?(ans?"correct":sel?"wrong":""):sel?"selected":"";let mark=checked&&ans?"✓":checked&&sel?"×":"";return `<button class="option ${state}" data-word="${w}"><span class="num">${i+1}</span><span>${w}</span><span class="mark">${mark}</span></button>`}).join("");
  document.querySelectorAll(".option").forEach(b=>b.onclick=()=>choose(b.dataset.word));
  const rows=question.options.map(o=>`<div class="meaning-row"><b>${o.word}${question.answers.includes(o.word)?" ✓":""}</b><span>${o.meaning}</span></div>`).join("");
  $("feedback").innerHTML=checked?`<div class="feedback ${isRight()?"ok":"no"}"><h2>${isRight()?"✓ 回答正确":"再记一次"}</h2><p><b>${question.answers.join(" = ")}</b><span class="meaning">${question.meaning}</span></p><div class="meanings">${rows}</div></div>`:"";
  $("action").disabled=!checked&&selected.length!==2;$("action").textContent=checked?"下一题":"提交答案";
}
function showComplete(){
  const accuracy=total?Math.round(correct/total*100):0;results[day]={accuracy,correct,total,completedAt:new Date().toISOString()};delete progress[day];localStorage.setItem("gre-day-results",JSON.stringify(results));localStorage.setItem("gre-day-progress",JSON.stringify(progress));renderDays();
  document.querySelector(".progress").style.display="none";$("options").innerHTML="";$("feedback").innerHTML=`<div class="complete"><div class="ring">${accuracy}%</div><h2>Day ${day} 完成</h2><p>答对 ${correct} / ${total} 题。今天的词汇已经全部练习完成。</p><button class="primary" onclick="selectDay(${day===5?1:day+1})">${day===5?"回到 Day 1":"开始 Day "+(day+1)}</button></div>`;$("action").style.display="none";
}
function showSavedResult(){
  const r=results[day];document.querySelector(".progress").style.display="none";$("options").innerHTML="";
  $("feedback").innerHTML=`<div class="complete"><div class="ring">${r.accuracy}%</div><h2>Day ${day} 已完成</h2><p>历史成绩：答对 ${r.correct} / ${r.total} 题。你的记录已保存在这台设备上。</p><button class="primary" onclick="restartDay(${day})">重新练习 Day ${day}</button></div>`;$("action").style.display="none";
}
function restartDay(n){delete results[n];delete progress[n];localStorage.setItem("gre-day-results",JSON.stringify(results));localStorage.setItem("gre-day-progress",JSON.stringify(progress));selectDay(n)}
function openWordList(){
  const words=groups.filter(g=>g.day===day);
  $("list-title").textContent=`Day ${day} 单词表`;$("list-count").textContent=`共 ${words.length} 组`;
  $("vocab-list").innerHTML=words.map(g=>`<article class="vocab-row"><div class="vocab-word">${g.word}</div><div class="vocab-synonyms">= ${g.synonyms.join(", ")}</div><div class="vocab-meaning">${g.meaning}</div></article>`).join("");
  $("list-page").classList.add("open");$("list-page").setAttribute("aria-hidden","false");document.body.style.overflow="hidden";
}
function closeWordList(){$("list-page").classList.remove("open");$("list-page").setAttribute("aria-hidden","true");document.body.style.overflow=""}
const oldSelectDay=selectDay;selectDay=function(n){document.querySelector(".progress").style.display="flex";$("action").style.display="block";oldSelectDay(n)}
$("action").onclick=submit;
$("open-list").onclick=openWordList;$("close-list").onclick=closeWordList;
addEventListener("keydown",e=>{if($("list-page").classList.contains("open")){if(e.key==="Escape")closeWordList();return}if(e.key==="Enter")submit();const i=Number(e.key)-1;if(!checked&&i>=0&&i<6)choose(question.options[i].word)});
if(Array.isArray(window.WORD_GROUPS)){
  groups=window.WORD_GROUPS;
  $("footer").textContent=`词库来自《真经 GRE 等价词汇总》 · 共 ${groups.length} 组，按原 PDF 分为 5 天`;
  selectDay(1);
}else{
  $("footer").textContent="词库载入失败，请重新打开页面";
}
</script>
</body>
</html>
